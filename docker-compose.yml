version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:7860"
    env_file:
      - .env
    volumes:
      - ./arbitration_audit.db:/app/arbitration_audit.db
    depends_on:
      - ollama
    restart: unless-stopped

  streamlit:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE=http://api:7860
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
